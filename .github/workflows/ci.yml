name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm vendor:check
      - run: pnpm sprites:check
      - run: pnpm font:check
      - run: pnpm content:check
      - run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
      - run: deploy/smoke.sh
